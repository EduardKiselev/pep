upstream django_app {
    server web:8000;
}

# HTTP: Редирект на HTTPS + обслуживание ACME challenge для обновления сертификатов
server {
    listen 80;
    server_name foodpetgram.msk.ru www.foodpetgram.msk.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Основная конфигурация
server {
    listen 443 ssl;
    server_name foodpetgram.msk.ru www.foodpetgram.msk.ru;

    ssl_certificate /etc/letsencrypt/live/foodpetgram.msk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodpetgram.msk.ru/privkey.pem;
    
    # Рекомендуемые настройки безопасности SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    location /static/ {
        alias /app/foodcalc/static_backend/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/foodcalc/media/;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}